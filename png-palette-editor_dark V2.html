<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette Editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #1a1a1a;
    color: #d4d4d4;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #252525;
    border-bottom: 1px solid #3a3a3a;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  #toolbar button, #toolbar label.tb-btn {
    padding: 4px 10px;
    background: #333;
    border: 1px solid #4a4a4a;
    color: #d4d4d4;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }
  #toolbar button:hover, #toolbar label.tb-btn:hover { background: #444; }
  #toolbar button:disabled { opacity: 0.4; cursor: default; }
  #toolbar .sep { width: 1px; height: 20px; background: #3a3a3a; margin: 0 2px; }

  #status {
    flex: 1;
    font-size: 11px;
    color: #888;
    padding-left: 6px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #reverse-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
  }

  /* ── Main area: image row on top, palette strip on bottom ── */
  #main {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ── Image row: main image + vertical resizer + ref image ── */
  #img-row {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ── Image panel ── */
  #img-panel {
    display: flex;
    flex-direction: column;
    flex: 1 1 50%;
    min-width: 80px;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    background: #222;
    border-bottom: 1px solid #3a3a3a;
    flex-shrink: 0;
    font-size: 11px;
    color: #888;
  }
  .panel-header span { flex: 1; }
  .panel-header button {
    padding: 2px 8px;
    background: #333;
    border: 1px solid #4a4a4a;
    color: #d4d4d4;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
  }
  .panel-header button:hover { background: #444; }

  #img-viewport {
    flex: 1;
    overflow: auto;
    position: relative;
    background: #111;
    cursor: crosshair;
    min-height: 0;
  }

  #img-viewport canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transform-origin: top left;
  }

  /* ── Vertical drag resizer between the two image panels ── */
  #v-resizer {
    width: 5px;
    background: #2a2a2a;
    border-left: 1px solid #3a3a3a;
    border-right: 1px solid #3a3a3a;
    cursor: ew-resize;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #v-resizer:hover, #v-resizer.dragging { background: #3a5a8a; }
  #v-resizer::after {
    content: '';
    width: 2px;
    height: 32px;
    border-radius: 1px;
    background: #555;
  }

  /* ── Reference panel ── */
  #ref-panel {
    display: flex;
    flex-direction: column;
    flex: 1 1 50%;
    min-width: 28px;
    overflow: hidden;
  }

  #ref-panel .panel-header { background: #1e2a1e; border-color: #2a3a2a; }
  #ref-panel .panel-header > span { color: #7aaa7a; }

  #ref-viewport {
    flex: 1;
    overflow: auto;
    position: relative;
    background: #0e110e;
    cursor: crosshair;
    min-height: 0;
    user-select: none;
  }

  #ref-panel.collapsed { flex-basis: 28px !important; flex-grow: 0; }
  #ref-panel.collapsed #ref-viewport { display: none; }

  #ref-canvas-wrap {
    position: relative;
    display: inline-block;
    line-height: 0;
  }

  #ref-canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #ref-marker {
    position: absolute;
    pointer-events: none;
    display: none;
    transform: translate(-50%, -50%);
  }

  #ref-drop-zone {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #3a5a3a; font-size: 13px;
    pointer-events: none; user-select: none; gap: 8px;
  }
  #ref-drop-zone svg { opacity: 0.35; }
  #ref-drop-zone.active { color: #5aaa5a; border: 2px dashed #5aaa5a; background: rgba(90,170,90,0.05); }

  #ref-pixel-info {
    position: absolute; bottom: 6px; left: 6px;
    background: rgba(0,0,0,0.75); color: #ccc;
    font-size: 10px; font-family: monospace;
    padding: 3px 7px; border-radius: 3px;
    pointer-events: none; display: none;
  }

  #sample-flash {
    position: absolute; top: 6px; right: 6px;
    background: rgba(60,160,80,0.93); color: #fff;
    font-size: 10px; font-family: monospace;
    padding: 3px 8px; border-radius: 3px;
    pointer-events: none; opacity: 0; transition: opacity 0.12s;
  }
  #sample-flash.show { opacity: 1; }

  #ref-no-slot {
    position: absolute; top: 6px; right: 6px;
    background: rgba(180,90,50,0.93); color: #fff;
    font-size: 10px; padding: 3px 8px; border-radius: 3px;
    pointer-events: none; opacity: 0; transition: opacity 0.12s;
  }
  #ref-no-slot.show { opacity: 1; }

  /* ── Vertical resizer between img-row and palette strip ── */
  #h-resizer {
    height: 5px;
    background: #2a2a2a;
    border-top: 1px solid #3a3a3a;
    border-bottom: 1px solid #3a3a3a;
    cursor: ns-resize;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #h-resizer:hover, #h-resizer.dragging { background: #3a5a8a; }
  #h-resizer::after {
    content: '';
    width: 32px; height: 2px;
    border-radius: 1px; background: #555;
  }

  /* ── Palette strip at the bottom ── */
  #pal-panel {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 44px;
    max-height: 50vh;
    border-top: 1px solid #3a3a3a;
    overflow: hidden;
  }

  #pal-panel .panel-header { border-top: none; }

  /* swatches scroll horizontally, wrap into rows */
  #pal-list {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 5px 6px;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 3px;
    align-content: flex-start;
  }

  /* each swatch is now a compact square tile */
  .swatch-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 3px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.1s;
    flex-shrink: 0;
  }
  .swatch-row:hover { background: #2c2c2c; }
  .swatch-row.active { background: #2c3a4a; border-color: #4a7acc; }
  .swatch-row.highlighted { outline: 2px solid #f5a623; outline-offset: -1px; }

  .swatch {
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
    transition: transform 0.1s;
  }
  .swatch-row:hover .swatch { transform: scale(1.08); }

  /* slot index shown below each swatch, hex/rgb only on hover via title */
  .swatch-idx { font-size: 9px; color: #555; line-height: 1; }
  .swatch-hex { display: none; }
  .swatch-rgb { display: none; }
  .swatch-info { display: flex; flex-direction: column; align-items: center; }

  /* ── Color editor — now floats above palette when a slot is active ── */
  #editor {
    flex-shrink: 0;
    padding: 7px 10px;
    background: #202020;
    border-top: 1px solid #3a3a3a;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #editor.hidden { display: none; }

  #editor h3 {
    font-size: 12px;
    color: #aaa;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    margin: 0;
  }

  #ed-preview {
    width: 22px; height: 22px;
    border-radius: 3px;
    border: 1px solid #555;
    flex-shrink: 0;
  }

  .ed-row { display: flex; align-items: center; gap: 5px; margin: 0; }
  .ed-label { font-size: 11px; color: #888; flex-shrink: 0; }

  .ed-row input[type="text"],
  .ed-row input[type="number"] {
    background: #2a2a2a;
    border: 1px solid #444;
    color: #d4d4d4;
    border-radius: 3px;
    padding: 3px 5px;
    font-size: 12px;
    font-family: monospace;
  }
  .ed-row input[type="text"] { width: 80px; }
  .ed-row input[type="number"] { width: 46px; }
  .ed-row input[type="color"] {
    width: 32px; height: 24px;
    padding: 1px;
    border: 1px solid #444;
    border-radius: 3px;
    background: #2a2a2a;
    cursor: pointer;
  }
  .ed-row input:focus { outline: none; border-color: #4a7acc; }

  #ed-apply {
    padding: 3px 10px;
    background: #4a7acc;
    border: none;
    color: #fff;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
  }
  #ed-apply:hover { background: #5a8adc; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #1a1a1a; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  #drop-zone {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #555; font-size: 16px;
    pointer-events: none; user-select: none;
  }
  #drop-zone.active { color: #4a7acc; border: 2px dashed #4a7acc; background: rgba(74,122,204,0.05); }
  #drop-zone svg { margin-bottom: 12px; opacity: 0.4; }

  #pixel-info {
    position: absolute; bottom: 6px; left: 6px;
    background: rgba(0,0,0,0.7); color: #ccc;
    font-size: 10px; font-family: monospace;
    padding: 3px 7px; border-radius: 3px;
    pointer-events: none; display: none;
  }
</style>
</head>
<body>
<div id="app">

  <div id="toolbar">
    <label class="tb-btn">
      📂 Open PNG
      <input type="file" id="file-input" accept=".png,image/png" style="display:none">
    </label>
    <div class="sep"></div>
    <button id="save-png-btn" disabled>💾 Save PNG</button>
    <button id="save-act-btn" disabled>🎨 Save .ACT</button>
    <div id="reverse-wrap">
      <input type="checkbox" id="reverse-chk">
      <label for="reverse-chk" style="cursor:pointer;">Reverse order</label>
    </div>
    <div class="sep"></div>
    <button id="undo-btn" disabled title="Undo (Ctrl+Z)">↩ Undo</button>
    <button id="redo-btn" disabled title="Redo (Ctrl+Shift+Z)">↪ Redo</button>
    <div class="sep"></div>

      🖼 Load Reference
      <input type="file" id="ref-file-input" accept="image/*" style="display:none">
    </label>
    <button id="ref-clear-btn" disabled>✕ Clear Ref</button>
    <div class="sep"></div>
    <span id="status">Open a PNG file to begin.</span>
  </div>

  <div id="main">

    <!-- Image row: main image | v-resizer | reference -->
    <div id="img-row">

      <div id="img-panel">
        <div class="panel-header">
          <span id="img-label">Image</span>
          <button id="img-zoom-out">−</button>
          <button id="img-fit">fit</button>
          <button id="img-zoom-in">+</button>
          <button id="img-zoom-1">1x</button>
        </div>
        <div id="img-viewport">
          <canvas id="canvas"></canvas>
          <div id="drop-zone">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            Drop PNG here or click Open PNG
          </div>
          <div id="pixel-info"></div>
        </div>
      </div>

      <div id="v-resizer"></div>

      <div id="ref-panel">
        <div class="panel-header">
          <span id="ref-label">Reference &nbsp;<span id="ref-hint" style="color:#555;font-size:10px;">— right-click to sample into selected slot</span></span>
          <button id="ref-zoom-out">−</button>
          <button id="ref-fit">fit</button>
          <button id="ref-zoom-in">+</button>
          <button id="ref-zoom-1">1x</button>
          <button id="ref-toggle">◀</button>
        </div>
        <div id="ref-viewport">
          <div id="ref-canvas-wrap">
            <canvas id="ref-canvas"></canvas>
            <div id="ref-marker">
              <svg width="21" height="21" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10.5" cy="10.5" r="7.5" fill="none" stroke="#000" stroke-width="2.5"/>
                <circle cx="10.5" cy="10.5" r="7.5" fill="none" stroke="#fff" stroke-width="1.5"/>
                <line x1="10.5" y1="1"    x2="10.5" y2="5.5"  stroke="#000" stroke-width="2.5"/>
                <line x1="10.5" y1="1"    x2="10.5" y2="5.5"  stroke="#fff" stroke-width="1.5"/>
                <line x1="10.5" y1="15.5" x2="10.5" y2="20"   stroke="#000" stroke-width="2.5"/>
                <line x1="10.5" y1="15.5" x2="10.5" y2="20"   stroke="#fff" stroke-width="1.5"/>
                <line x1="1"    y1="10.5" x2="5.5"  y2="10.5" stroke="#000" stroke-width="2.5"/>
                <line x1="1"    y1="10.5" x2="5.5"  y2="10.5" stroke="#fff" stroke-width="1.5"/>
                <line x1="15.5" y1="10.5" x2="20"   y2="10.5" stroke="#000" stroke-width="2.5"/>
                <line x1="15.5" y1="10.5" x2="20"   y2="10.5" stroke="#fff" stroke-width="1.5"/>
              </svg>
            </div>
          </div>
          <div id="ref-drop-zone">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            Drop any image here or click Load Reference
          </div>
          <div id="ref-pixel-info"></div>
          <div id="sample-flash"></div>
          <div id="ref-no-slot">Select a palette slot first</div>
        </div>
      </div>

    </div>

    <!-- Horizontal resizer between image row and palette -->
    <div id="h-resizer"></div>

    <!-- Palette strip + inline editor -->
    <div id="pal-panel">
      <div class="panel-header">
        <span id="pal-label">Palette</span>
        <button id="pal-zoom-out">−</button>
        <button id="pal-zoom-in">+</button>

      </div>
      <div id="editor" class="hidden">
        <h3><div id="ed-preview"></div><span id="ed-title">Edit Color</span></h3>

          <span class="ed-label">R</span><input type="number" id="ed-r" min="0" max="255">
          <span class="ed-label">G</span><input type="number" id="ed-g" min="0" max="255">
          <span class="ed-label">B</span><input type="number" id="ed-b" min="0" max="255">
          <button id="ed-apply">Apply</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let pal = [];
let indexMap = null;
let imgW = 0, imgH = 0;
let originalFilename = 'image';
let imgZoom = 1;
let palSwatchSize = 28;
let selectedSlot = null;
let hoveredSlot = null;

let refImageData = null;
let refW = 0, refH = 0;
let refZoom = 1;
let refMarkerPos = null;

// ── Undo / Redo history ────────────────────────────────────────────────────────
const HISTORY_LIMIT = 100;
let undoStack = [];
let redoStack = [];

// ── Element refs ───────────────────────────────────────────────────────────────
const fileInput    = document.getElementById('file-input');
const canvas       = document.getElementById('canvas');
const ctx          = canvas.getContext('2d');
const imgVP        = document.getElementById('img-viewport');
const dropZone     = document.getElementById('drop-zone');
const pixelInfo    = document.getElementById('pixel-info');
const palList      = document.getElementById('pal-list');
const editor       = document.getElementById('editor');
const edTitle      = document.getElementById('ed-title');
const edPreview    = document.getElementById('ed-preview');
const edHex        = document.getElementById('ed-hex');
const edPicker     = document.getElementById('ed-picker');
const edR          = document.getElementById('ed-r');
const edG          = document.getElementById('ed-g');
const edB          = document.getElementById('ed-b');
const edApply      = document.getElementById('ed-apply');
const status       = document.getElementById('status');
const palLabel     = document.getElementById('pal-label');
const imgLabel     = document.getElementById('img-label');
const savePngBtn   = document.getElementById('save-png-btn');
const saveActBtn   = document.getElementById('save-act-btn');
const reverseChk   = document.getElementById('reverse-chk');

const refFileInput = document.getElementById('ref-file-input');
const refCanvas    = document.getElementById('ref-canvas');
const refCtx       = refCanvas.getContext('2d');
const refVP        = document.getElementById('ref-viewport');
const refWrap      = document.getElementById('ref-canvas-wrap');
const refDropZone  = document.getElementById('ref-drop-zone');
const refPixelInfo = document.getElementById('ref-pixel-info');
const refMarker    = document.getElementById('ref-marker');
const sampleFlash  = document.getElementById('sample-flash');
const refNoSlot    = document.getElementById('ref-no-slot');
const refPanel     = document.getElementById('ref-panel');
const refLabel     = document.getElementById('ref-label');
const refHint      = document.getElementById('ref-hint');
const refClearBtn  = document.getElementById('ref-clear-btn');

// ── PNG parsing ────────────────────────────────────────────────────────────────
async function parsePNG(file) {
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const sig = [137,80,78,71,13,10,26,10];
  for (let i = 0; i < 8; i++) if (bytes[i] !== sig[i]) throw new Error('Not a valid PNG file.');
  let pos = 8, width = 0, height = 0, bitDepth = 0, colorType = 0;
  let plte = [], idatChunks = [];
  function read32(p) { return (bytes[p]<<24|bytes[p+1]<<16|bytes[p+2]<<8|bytes[p+3])>>>0; }
  while (pos < bytes.length - 4) {
    const length = read32(pos); pos += 4;
    const type = String.fromCharCode(bytes[pos],bytes[pos+1],bytes[pos+2],bytes[pos+3]);
    pos += 4;
    const data = bytes.slice(pos, pos + length); pos += length; pos += 4;
    if (type === 'IHDR') {
      width=(data[0]<<24|data[1]<<16|data[2]<<8|data[3])>>>0;
      height=(data[4]<<24|data[5]<<16|data[6]<<8|data[7])>>>0;
      bitDepth=data[8]; colorType=data[9];
    } else if (type === 'PLTE') {
      for (let i = 0; i < data.length; i += 3) plte.push({r:data[i],g:data[i+1],b:data[i+2]});
    } else if (type === 'IDAT') { idatChunks.push(data);
    } else if (type === 'IEND') { break; }
  }
  return { width, height, bitDepth, colorType, plte, idatChunks };
}

async function decompressIDAT(chunks) {
  const total = chunks.reduce((s,c)=>s+c.length,0);
  const combined = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { combined.set(c, off); off += c.length; }
  const rawDeflate = combined.slice(2, combined.length - 4);
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(rawDeflate); writer.close();
  const reader = ds.readable.getReader();
  const parts = [];
  while (true) { const {done,value} = await reader.read(); if (done) break; parts.push(value); }
  const out = new Uint8Array(parts.reduce((s,p)=>s+p.length,0));
  let o = 0; for (const p of parts) { out.set(p,o); o+=p.length; }
  return out;
}

function unfilter(raw, width, height, bitDepth, channels) {
  const stride = Math.ceil(width * bitDepth * channels / 8);
  const out = new Uint8Array(height * stride);
  function paeth(a,b,c){const p=a+b-c,pa=Math.abs(p-a),pb=Math.abs(p-b),pc=Math.abs(p-c);return pa<=pb&&pa<=pc?a:pb<=pc?b:c;}
  let pos = 0;
  for (let y = 0; y < height; y++) {
    const filter = raw[pos++];
    const rowRaw = raw.slice(pos, pos + stride); pos += stride;
    const row = new Uint8Array(stride);
    const prev = y > 0 ? out.slice((y-1)*stride, y*stride) : new Uint8Array(stride);
    const bpp = Math.max(1, Math.floor(bitDepth * channels / 8));
    for (let i = 0; i < stride; i++) {
      const x=rowRaw[i],a=i>=bpp?row[i-bpp]:0,b=prev[i],c=i>=bpp?prev[i-bpp]:0;
      switch(filter){case 0:row[i]=x;break;case 1:row[i]=(x+a)&0xFF;break;case 2:row[i]=(x+b)&0xFF;break;
        case 3:row[i]=(x+((a+b)>>1))&0xFF;break;case 4:row[i]=(x+paeth(a,b,c))&0xFF;break;default:row[i]=x;}
    }
    out.set(row, y * stride);
  }
  return out;
}

function extractIndices(pixelData, width, height, bitDepth) {
  const indices = new Uint8Array(width * height);
  const stride = Math.ceil(width * bitDepth / 8);
  let pi = 0;
  for (let y = 0; y < height; y++) {
    const rowStart = y * stride;
    for (let x = 0; x < width; x++) {
      let idx = 0;
      if (bitDepth===8) { idx=pixelData[rowStart+x]; }
      else if (bitDepth===4) { const b=pixelData[rowStart+Math.floor(x/2)]; idx=x%2===0?(b>>4):(b&0xF); }
      else if (bitDepth===2) { const b=pixelData[rowStart+Math.floor(x/4)]; idx=(b>>(6-(x%4)*2))&0x3; }
      else if (bitDepth===1) { const b=pixelData[rowStart+Math.floor(x/8)]; idx=(b>>(7-(x%8)))&0x1; }
      indices[pi++] = idx;
    }
  }
  return indices;
}

// ── Load main image ────────────────────────────────────────────────────────────
async function loadFile(file) {
  originalFilename = file.name.replace(/\.png$/i, '');
  setStatus('Loading…');
  try {
    const info = await parsePNG(file);
    const { width, height, bitDepth, colorType, plte, idatChunks } = info;
    imgW = width; imgH = height;
    if (colorType === 3 && plte.length > 0) {
      const rawPixels = await decompressIDAT(idatChunks);
      const pixelData = unfilter(rawPixels, width, height, bitDepth, 1);
      indexMap = extractIndices(pixelData, width, height, bitDepth);
      pal = plte.map(c => ({...c}));
      setStatus(`Indexed PNG — ${pal.length} colors, ${width}×${height} — palette order preserved`);
    } else {
      const url = URL.createObjectURL(file);
      await new Promise((res,rej) => {
        const img = new Image();
        img.onload = () => { canvas.width=width; canvas.height=height; ctx.drawImage(img,0,0); URL.revokeObjectURL(url); res(); };
        img.onerror = rej; img.src = url;
      });
      const imgData = ctx.getImageData(0,0,width,height); const d = imgData.data;
      const colorToIdx = new Map(); pal = []; indexMap = new Uint8Array(width*height);
      for (let i = 0; i < width*height; i++) {
        const r=d[i*4],g=d[i*4+1],b=d[i*4+2],key=(r<<16)|(g<<8)|b;
        if (!colorToIdx.has(key)) { colorToIdx.set(key, pal.length); pal.push({r,g,b}); }
        indexMap[i] = colorToIdx.get(key);
      }
      setStatus(`Non-indexed PNG — ${pal.length} unique colors, ${width}×${height}`);
    }
    imgLabel.textContent = `Image  ${width}×${height}`;
    palLabel.textContent = `Palette  (${pal.length})`;
    redrawCanvas(); dropZone.style.display = 'none'; fitImage();
    renderPalette(); savePngBtn.disabled=false; saveActBtn.disabled=false;
    selectedSlot=null; editor.classList.add('hidden');
    undoStack=[]; redoStack=[]; undoBtn.disabled=true; redoBtn.disabled=true;
  } catch(e) { setStatus('Error: '+e.message); console.error(e); }
}

// ── Load reference image ───────────────────────────────────────────────────────
async function loadRefFile(file) {
  const url = URL.createObjectURL(file);
  await new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      refW = img.naturalWidth; refH = img.naturalHeight;
      refCanvas.width = refW; refCanvas.height = refH;
      refCtx.drawImage(img, 0, 0);
      refImageData = refCtx.getImageData(0, 0, refW, refH);
      URL.revokeObjectURL(url);
      res();
    };
    img.onerror = rej; img.src = url;
  });
  refDropZone.style.display = 'none';
  refMarkerPos = null;
  refMarker.style.display = 'none';
  refClearBtn.disabled = false;
  refHint.textContent = `${file.name}  ${refW}×${refH} — right-click to sample`;
  refHint.style.color = '#4a8a4a';
  applyRefZoom();
  fitRefImage();
}

function clearRef() {
  refImageData = null; refW = 0; refH = 0;
  refCanvas.width = 1; refCanvas.height = 1;
  refMarkerPos = null;
  refMarker.style.display = 'none';
  refDropZone.style.display = '';
  refClearBtn.disabled = true;
  refHint.textContent = '— right-click to sample into selected slot';
  refHint.style.color = '#555';
}

function applyRefZoom() {
  refCanvas.style.width  = Math.round(refW * refZoom) + 'px';
  refCanvas.style.height = Math.round(refH * refZoom) + 'px';
  refWrap.style.width    = Math.round(refW * refZoom) + 'px';
  refWrap.style.height   = Math.round(refH * refZoom) + 'px';
  placeRefMarker();
}

function fitRefImage() {
  if (!refImageData) return;
  const vw = refVP.clientWidth - 16, vh = refVP.clientHeight - 16;
  refZoom = Math.min(vw / refW, vh / refH, 1);
  applyRefZoom();
}

function placeRefMarker() {
  if (!refMarkerPos) return;
  refMarker.style.left = Math.round((refMarkerPos.x + 0.5) * refZoom) + 'px';
  refMarker.style.top  = Math.round((refMarkerPos.y + 0.5) * refZoom) + 'px';
}

function getRefCoords(e) {
  const r = refCanvas.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - r.left) / refZoom),
    y: Math.floor((e.clientY - r.top)  / refZoom)
  };
}

// ── Sampling ───────────────────────────────────────────────────────────────────
function sampleRef(x, y) {
  if (!refImageData || x < 0 || x >= refW || y < 0 || y >= refH) return;
  if (selectedSlot === null) { showNoSlot(); return; }
  const i = (y * refW + x) * 4;
  const r = refImageData.data[i], g = refImageData.data[i+1], b = refImageData.data[i+2];
  historyPush();
  applyColorToSlot(selectedSlot, r, g, b);
  syncEditorFromSlot(selectedSlot);
  // place marker
  refMarkerPos = {x, y};
  refMarker.style.display = 'block';
  placeRefMarker();
  // flash
  sampleFlash.textContent = `rgb(${r},${g},${b})  →  slot ${selectedSlot}`;
  sampleFlash.classList.add('show');
  clearTimeout(sampleFlash._t);
  sampleFlash._t = setTimeout(() => sampleFlash.classList.remove('show'), 1400);
}

function showNoSlot() {
  refNoSlot.classList.add('show');
  clearTimeout(refNoSlot._t);
  refNoSlot._t = setTimeout(() => refNoSlot.classList.remove('show'), 1400);
}

// ── Main canvas ────────────────────────────────────────────────────────────────
// spacePreview: while Space is held, draw full color regardless of highlight
let spacePreview = false;

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && !spacePreview) {
    // don't hijack space when typing in an input
    if (document.activeElement.tagName === 'INPUT') return;
    e.preventDefault();
    spacePreview = true;
    redrawCanvas(selectedSlot); // redraw without darkening
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && spacePreview) {
    e.preventDefault();
    spacePreview = false;
    redrawCanvas(selectedSlot); // restore darkening
  }
});

function redrawCanvas(highlightSlot=null) {
  canvas.width=imgW; canvas.height=imgH;
  if (!indexMap) return;
  const imgData=ctx.createImageData(imgW,imgH); const d=imgData.data;
  // if space is held, treat as if no highlight (full color everywhere)
  const effective = spacePreview ? null : highlightSlot;
  for (let i=0;i<imgW*imgH;i++) {
    const slot=indexMap[i],c=pal[slot];
    if (effective!==null&&slot!==effective) { d[i*4]=c.r>>1;d[i*4+1]=c.g>>1;d[i*4+2]=c.b>>1;d[i*4+3]=255; }
    else { d[i*4]=c.r;d[i*4+1]=c.g;d[i*4+2]=c.b;d[i*4+3]=255; }
  }
  ctx.putImageData(imgData,0,0);
}

function applyZoom(){canvas.style.width=Math.round(imgW*imgZoom)+'px';canvas.style.height=Math.round(imgH*imgZoom)+'px';}
function fitImage(){const vw=imgVP.clientWidth-16,vh=imgVP.clientHeight-16;imgZoom=Math.min(vw/imgW,vh/imgH,1);applyZoom();}

document.getElementById('img-zoom-in').onclick =()=>{imgZoom=Math.min(imgZoom*1.25,32);applyZoom();};
document.getElementById('img-zoom-out').onclick=()=>{imgZoom=Math.max(imgZoom/1.25,0.05);applyZoom();};
document.getElementById('img-fit').onclick     =fitImage;
document.getElementById('img-zoom-1').onclick  =()=>{imgZoom=1;applyZoom();};
imgVP.addEventListener('wheel',e=>{if(!indexMap)return;e.preventDefault();imgZoom=Math.max(0.05,Math.min(32,imgZoom*(e.deltaY<0?1.1:0.9)));applyZoom();},{passive:false});

function getCanvasCoords(e){const r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)/imgZoom),y:Math.floor((e.clientY-r.top)/imgZoom)};}

canvas.addEventListener('mousemove',e=>{
  if(!indexMap)return;const{x,y}=getCanvasCoords(e);
  if(x<0||x>=imgW||y<0||y>=imgH){pixelInfo.style.display='none';return;}
  const slot=indexMap[y*imgW+x],c=pal[slot];
  pixelInfo.style.display='block';pixelInfo.textContent=`x:${x} y:${y}  slot:${slot}  rgb(${c.r},${c.g},${c.b})`;
  hoveredSlot=slot;

});

canvas.addEventListener('click',e=>{if(!indexMap)return;const{x,y}=getCanvasCoords(e);if(x<0||x>=imgW||y<0||y>=imgH)return;selectSlot(indexMap[y*imgW+x]);});

// ── Palette ────────────────────────────────────────────────────────────────────
function renderPalette(){
  palList.innerHTML='';
  pal.forEach((c,i)=>{
    const row=document.createElement('div');
    row.className='swatch-row'+(i===selectedSlot?' active':''); row.dataset.idx=i;
    const hex=rgbToHex(c);
    row.title=`slot ${i}  ${hex}  rgb(${c.r},${c.g},${c.b})`;
    row.innerHTML=`<div class="swatch" style="background:${hex};width:${palSwatchSize}px;height:${palSwatchSize}px"></div><div class="swatch-info"><div class="swatch-idx">${i}</div></div>`;
    row.addEventListener('mouseenter',()=>{hoveredSlot=i;redrawCanvas(i);});
    row.addEventListener('mouseleave',()=>{hoveredSlot=null;redrawCanvas(selectedSlot);});

// ── Color editor ───────────────────────────────────────────────────────────────
function openEditor(slot){edTitle.textContent=`Edit slot ${slot}`;editor.classList.remove('hidden');syncEditorFromSlot(slot);}
function syncEditorFromSlot(slot){const c=pal[slot],hex=rgbToHex(c);edHex.value=hex;edPicker.value=hex;edR.value=c.r;edG.value=c.g;edB.value=c.b;edPreview.style.background=hex;}

// ── History ────────────────────────────────────────────────────────────────────
const undoBtn = document.getElementById('undo-btn');
const redoBtn = document.getElementById('redo-btn');

function snapPal() { return pal.map(c=>({...c})); }

function historyPush() {
  undoStack.push(snapPal());
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
  undoBtn.disabled = false;
  redoBtn.disabled = true;
}

function updateHistoryButtons() {
  undoBtn.disabled = undoStack.length === 0;
  redoBtn.disabled = redoStack.length === 0;
}

function doUndo() {
  if (undoStack.length === 0) return;
  redoStack.push(snapPal());
  pal = undoStack.pop();
  afterHistoryJump();
}

function doRedo() {
  if (redoStack.length === 0) return;
  undoStack.push(snapPal());
  pal = redoStack.pop();
  afterHistoryJump();
}

function afterHistoryJump() {
  updateHistoryButtons();
  renderPalette();
  redrawCanvas(selectedSlot);
  if (selectedSlot !== null && selectedSlot < pal.length) syncEditorFromSlot(selectedSlot);
}

undoBtn.addEventListener('click', doUndo);
redoBtn.addEventListener('click', doRedo);

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
  if ((e.key === 'Z' && e.shiftKey) || (e.key === 'y')) { e.preventDefault(); doRedo(); }
});

// applyColorToSlot — does NOT push history itself; callers decide when to push
function applyColorToSlot(slot,r,g,b){pal[slot]={r,g,b};updateSwatchRow(slot);edPreview.style.background=rgbToHex({r,g,b});redrawCanvas(slot);}

// Picker: push once on mousedown (start of drag), apply silently on every input
edPicker.addEventListener('mousedown', () => { historyPush(); });

edPicker.addEventListener('input',()=>{const c=hexToRgb(edPicker.value);if(!c)return;edHex.value=edPicker.value.toUpperCase();edR.value=c.r;edG.value=c.g;edB.value=c.b;applyColorToSlot(selectedSlot,c.r,c.g,c.b);});
edApply.addEventListener('click',()=>{const r=clamp(parseInt(edR.value)||0,0,255),g=clamp(parseInt(edG.value)||0,0,255),b=clamp(parseInt(edB.value)||0,0,255);edR.value=r;edG.value=g;edB.value=b;const hex=rgbToHex({r,g,b});edHex.value=hex;edPicker.value=hex;historyPush();applyColorToSlot(selectedSlot,r,g,b);});
[edR,edG,edB].forEach(inp=>inp.addEventListener('input',()=>{const r=clamp(parseInt(edR.value)||0,0,255),g=clamp(parseInt(edG.value)||0,0,255),b=clamp(parseInt(edB.value)||0,0,255);edPreview.style.background=rgbToHex({r,g,b});edHex.value=rgbToHex({r,g,b});edPicker.value=rgbToHex({r,g,b});}));

// ── Save ───────────────────────────────────────────────────────────────────────
savePngBtn.addEventListener('click',()=>{
  const doReverse=reverseChk.checked;
  let workPal=[...pal],workMap=indexMap;
  if(doReverse){const n=pal.length,remap=new Uint8Array(n);for(let i=0;i<n;i++)remap[i]=n-1-i;workPal=pal.slice().reverse();workMap=new Uint8Array(indexMap.length);for(let i=0;i<indexMap.length;i++)workMap[i]=remap[indexMap[i]];}
  downloadBlob(new Blob([buildIndexedPNG(imgW,imgH,workPal,workMap)],{type:'image/png'}),originalFilename+'_edited.png');
});

function buildIndexedPNG(w,h,palette,pixelIndices){
  const n=palette.length,bitDepth=n<=2?1:n<=4?2:n<=16?4:8;
  const stride=Math.ceil(w*bitDepth/8),raw=new Uint8Array(h*(1+stride));
  let pos=0;
  for(let y=0;y<h;y++){
    raw[pos++]=0;
    if(bitDepth===8){for(let x=0;x<w;x++)raw[pos++]=pixelIndices[y*w+x];}
    else{let byte=0,bitsWritten=0;for(let x=0;x<w;x++){const idx=pixelIndices[y*w+x];
      if(bitDepth===4){byte=x%2===0?(idx<<4):byte|idx;if(x%2===1||x===w-1){raw[pos++]=byte;byte=0;}}
      else if(bitDepth===2){byte|=(idx&0x3)<<(6-bitsWritten);bitsWritten+=2;if(bitsWritten===8||x===w-1){raw[pos++]=byte;byte=0;bitsWritten=0;}}
      else{byte|=(idx&0x1)<<(7-bitsWritten);bitsWritten++;if(bitsWritten===8||x===w-1){raw[pos++]=byte;byte=0;bitsWritten=0;}}}}
  }
  const compressed=deflateSync(raw),chunks=[];
  const ihdr=new Uint8Array(13);new DataView(ihdr.buffer).setUint32(0,w);new DataView(ihdr.buffer).setUint32(4,h);ihdr[8]=bitDepth;ihdr[9]=3;
  chunks.push(makeChunk('IHDR',ihdr));
  const plteData=new Uint8Array(palette.length*3);for(let i=0;i<palette.length;i++){plteData[i*3]=palette[i].r;plteData[i*3+1]=palette[i].g;plteData[i*3+2]=palette[i].b;}
  chunks.push(makeChunk('PLTE',plteData));chunks.push(makeChunk('IDAT',compressed));chunks.push(makeChunk('IEND',new Uint8Array(0)));
  const sig=new Uint8Array([137,80,78,71,13,10,26,10]),out=new Uint8Array(sig.length+chunks.reduce((s,c)=>s+c.length,0));
  let off=0;out.set(sig,off);off+=sig.length;for(const c of chunks){out.set(c,off);off+=c.length;}return out;
}

function deflateSync(data){
  const BSIZE=65535,blocks=Math.ceil(data.length/BSIZE)||1,out=[];
  out.push(0x78,0x9C);let pos=0;
  for(let b=0;b<blocks;b++){const isLast=b===blocks-1,chunk=data.slice(pos,pos+BSIZE),len=chunk.length;pos+=len;
    out.push(isLast?0x01:0x00,len&0xFF,(len>>8)&0xFF,(~len)&0xFF,((~len)>>8)&0xFF);for(let i=0;i<len;i++)out.push(chunk[i]);}
  let s1=1,s2=0;for(let i=0;i<data.length;i++){s1=(s1+data[i])%65521;s2=(s2+s1)%65521;}
  const adler=(s2<<16)|s1;out.push((adler>>>24)&0xFF,(adler>>>16)&0xFF,(adler>>>8)&0xFF,adler&0xFF);
  return new Uint8Array(out);
}

function makeChunk(type,data){
  const len=data.length,chunk=new Uint8Array(4+4+len+4),dv=new DataView(chunk.buffer);
  dv.setUint32(0,len);chunk[4]=type.charCodeAt(0);chunk[5]=type.charCodeAt(1);chunk[6]=type.charCodeAt(2);chunk[7]=type.charCodeAt(3);
  chunk.set(data,8);dv.setInt32(8+len,crc32(chunk.slice(4,8+len)));return chunk;
}

const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c;}return t;})();
function crc32(data){let crc=0xFFFFFFFF;for(let i=0;i<data.length;i++)crc=CRC_TABLE[(crc^data[i])&0xFF]^(crc>>>8);return(crc^0xFFFFFFFF)|0;}

saveActBtn.addEventListener('click',()=>{
  const workPal=reverseChk.checked?[...pal].reverse():[...pal];
  const act=new Uint8Array(768);for(let i=0;i<Math.min(workPal.length,256);i++){act[i*3]=workPal[i].r;act[i*3+1]=workPal[i].g;act[i*3+2]=workPal[i].b;}
  downloadBlob(new Blob([act],{type:'application/octet-stream'}),originalFilename+'_palette.act');
});

// ── File input / drag-drop (main) ──────────────────────────────────────────────
fileInput.addEventListener('change',e=>{const f=e.target.files[0];if(f)loadFile(f);fileInput.value='';});
imgVP.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('active');});
imgVP.addEventListener('dragleave',()=>dropZone.classList.remove('active'));
imgVP.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('active');const f=e.dataTransfer.files[0];if(f&&f.type==='image/png')loadFile(f);});

// ── Utilities ──────────────────────────────────────────────────────────────────
function rgbToHex({r,g,b}){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();}
function hexToRgb(hex){const m=hex.replace('#','').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);if(!m)return null;return{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)};}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function setStatus(msg){status.textContent=msg;}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);}
</script>
